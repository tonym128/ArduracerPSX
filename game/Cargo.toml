[package]
name = "arduracer"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "arduracer"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[features]
default = ["svg-track-texture", "qoi-track-stream", "tim-track-stream"]

# SVG-derived circuit textures (the `ARSV` container). On by default, and the
# preferred format: the authored vector geometry rasterised at 1024, plus a
# per-surface detail pass synthesised at decode.
#
# Turning it off drops every circuit back to QOI, then JPEG. As with the flag
# below, this can never remove content -- the fallbacks cover every case.
svg-track-texture = []

# Segmented-QOI circuit textures, on by default.
#
# QOI blocks stream from `QOITRACKS.BIN` instead of `TRACKS.BIN` for any
# circuit the cooker could fit losslessly into the 500 KB block budget, and
# decode roughly 4x cheaper per MCU row than the JPEG path. Circuits whose art
# is too detailed to fit (and the three 10 km^2 city maps, which are JPEG-only)
# fall back to JPEG automatically, so disabling this flag loses no content --
# it only returns every circuit to the JPEG streamer.
#
#   cargo build --release                          # QOI where available
#   cargo build --release --no-default-features    # JPEG everywhere
qoi-track-stream = []

# Uncompressed 15bpp circuit textures, streamed tile by tile and DMA'd into
# VRAM with no decode step (`TIMTRACKS.BIN`).
#
# On by default, but -- unlike the two above -- never chosen by `Auto`. It has
# to be selected explicitly, because it costs four times the disc space and
# reads four sectors per VRAM tile where the compressed formats read one 500 KB
# block per 256 tiles. On the single-block track layouts that is enough short
# reads to hand the drive away from CD-DA playback often enough to be heard as
# audio stutter, which is why the CD-audio setting exists alongside this one.
#
# Turning it off removes the option from the texture menu entirely; every
# circuit falls back through SVG -> QOI -> JPEG as before.
#
#   cargo build --release                                    # TIM selectable
#   cargo build --release --no-default-features              # JPEG everywhere
tim-track-stream = []

# Declared only so `cfg(feature = "host-test")` in `memcard.rs` resolves
# instead of warning as an unexpected cfg. DO NOT BUILD THE GAME WITH IT: it
# compiles the SIO0 wrappers out, and `main.rs` calls `probe()` / `flush()`.
# The supported way to run the memory card suite on the host is
# `tools/test_memcard`, which declares its own copy of the flag and includes
# `memcard.rs` textually.
host-test = []

# Frame-timing instrumentation. Off by default: it reads the emulator's guest
# cycle port at 0xBF802F08 (an Expansion 2 register, meaningless on real
# silicon), prints reports over the TTY, and replaces the pad with an AI driver
# so a headless run can get on circuit. Shipping builds must never enable it.
#
#   cargo build --release --features profiling
profiling = []

[dependencies]
psx-asset = { path = "../psoxide/sdk/crates/psx-asset" }
psx-font  = { path = "../psoxide/sdk/crates/psx-font" }
psx-gpu   = { path = "../psoxide/sdk/crates/psx-gpu" }
psx-pad   = { path = "../psoxide/sdk/crates/psx-pad" }
psx-rt    = { path = "../psoxide/sdk/crates/psx-rt" }
psx-spu   = { path = "../psoxide/sdk/crates/psx-spu" }
psx-vram  = { path = "../psoxide/sdk/crates/psx-vram" }
psx-math  = { path = "../psoxide/sdk/crates/psx-math" }
psx-hw    = { path = "../psoxide/crates/psx-hw" }
psx-io    = { path = "../psoxide/sdk/crates/psx-io" }
psx-gte   = { path = "../psoxide/sdk/crates/psx-gte" }
psx-gte-core = { path = "../psoxide/sdk/crates/psx-gte-core" }
psx-mc    = { path = "../psoxide/sdk/crates/psx-mc" }
psx-pack  = { path = "../psoxide/sdk/crates/psx-pack" }
psx-fmv   = { path = "../psoxide/sdk/crates/psx-fmv" }
arduracer-core = { path = "../crates/arduracer-core" }
