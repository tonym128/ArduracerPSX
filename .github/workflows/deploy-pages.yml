name: Deploy Web Arcade to GitHub Pages

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # FMV encoder used by tools/fmv_cook/cook_intro_str.py. Pinned with checksums;
  # without it the intro FMV degrades to a silent procedural placeholder.
  PSXAVENC_VERSION: "0.3.1"
  PSXAVENC_SHA256: ad22b887683631149fb8c7c85ecea8bb760dd482f9e18cce2b35b11319e95e51
  PSXAVENC_BIN_SHA256: 135fa941d750f6be0dd4176ffbab9fd70d801d68f931f1a609c4e701ef95972a

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MIPS bare-metal toolchain & media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu ffmpeg

      - name: Show toolchain
        run: rustup show

      - name: Install psxavenc (FMV encoder)
        # tools/fmv_cook/cook_intro_str.py silently falls back to a procedural
        # placeholder FMV -- no audio -- when psxavenc is absent. That is what CI
        # shipped: the deployed exe was 253,952 bytes against 346,112 for a local
        # build, which is exactly the 91 KB intro ADPCM. Pinned release, checksum
        # verified on both the archive and the extracted binary.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/psxavenc.zip \
            https://github.com/WonderfulToolchain/psxavenc/releases/download/v${PSXAVENC_VERSION}/psxavenc-linux.zip
          echo "${PSXAVENC_SHA256}  /tmp/psxavenc.zip" | sha256sum -c -
          unzip -o -q /tmp/psxavenc.zip -d /tmp/psxavenc
          echo "${PSXAVENC_BIN_SHA256}  /tmp/psxavenc/bin/psxavenc" | sha256sum -c -
          sudo install -m 0755 /tmp/psxavenc/bin/psxavenc /usr/local/bin/psxavenc
          psxavenc 2>&1 | head -1 || true

      - name: Check the vendored PSoXide SDK is present
        run: make deps

      - name: Build PS1 Executable, ISO, and Disc Images
        run: |
          make disc
          make iso

      - name: Stage Web Arcade Assets
        run: |
          mkdir -p web/roms
          cp dist/arduracer.exe dist/arduracer.cue dist/arduracer.bin dist/arduracer.iso web/roms/

      # PREREQUISITE (one-time, needs a repo admin): this workflow can only
      # *read* the Pages site. `actions/configure-pages`' `enablement` input
      # defaults to false, and its own description notes it "requires a token
      # other than GITHUB_TOKEN" -- the workflow token cannot create the site.
      # So if the site does not exist yet, this step fails with a bare
      # "HttpError: Not Found" on GET /repos/{owner}/{repo}/pages.
      # Fix once under Settings -> Pages -> Build and deployment -> Source ->
      # GitHub Actions. Do not set `enablement: true` here without also adding a
      # PAT secret; with GITHUB_TOKEN it cannot succeed.
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload Web Arcade Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
