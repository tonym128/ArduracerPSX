name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # FMV encoder used by tools/fmv_cook/cook_intro_str.py. Pinned with checksums;
  # without it the intro FMV degrades to a silent procedural placeholder.
  PSXAVENC_VERSION: "0.3.1"
  PSXAVENC_SHA256: ad22b887683631149fb8c7c85ecea8bb760dd482f9e18cce2b35b11319e95e51
  PSXAVENC_BIN_SHA256: 135fa941d750f6be0dd4176ffbab9fd70d801d68f931f1a609c4e701ef95972a

jobs:
  build-release:
    name: Build PS1 ISO & Disc Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: check_release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Install MIPS bare-metal toolchain & media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu ffmpeg zip

      - name: Show toolchain
        run: rustup show

      - name: Install psxavenc (FMV encoder)
        # tools/fmv_cook/cook_intro_str.py silently falls back to a procedural
        # placeholder FMV -- no audio -- when psxavenc is absent. That is what CI
        # shipped: the deployed exe was 253,952 bytes against 346,112 for a local
        # build, which is exactly the 91 KB intro ADPCM. Pinned release, checksum
        # verified on both the archive and the extracted binary.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/psxavenc.zip \
            https://github.com/WonderfulToolchain/psxavenc/releases/download/v${PSXAVENC_VERSION}/psxavenc-linux.zip
          echo "${PSXAVENC_SHA256}  /tmp/psxavenc.zip" | sha256sum -c -
          unzip -o -q /tmp/psxavenc.zip -d /tmp/psxavenc
          echo "${PSXAVENC_BIN_SHA256}  /tmp/psxavenc/bin/psxavenc" | sha256sum -c -
          sudo install -m 0755 /tmp/psxavenc/bin/psxavenc /usr/local/bin/psxavenc
          psxavenc 2>&1 | head -1 || true

      - name: Check the vendored PSoXide SDK is present
        # psoxide/sdk is committed here (see psoxide/PROVENANCE.md). Assert it up
        # front so a partial checkout fails with one line, not a cargo manifest
        # error partway through packaging.
        run: make deps

      - name: Package Full Release Distribution
        # Pass the tag's version so the archive is named for the release being
        # cut. Without this the zip kept whatever VERSION defaulted to.
        run: make release VERSION=${{ steps.check_release.outputs.version }}

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: "Arduracer PSX ${{ steps.check_release.outputs.tag }} - PlayStation 1 Master"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist/ArduracerPSX-v${{ steps.check_release.outputs.version }}-PSX.zip
            dist/arduracer.bin
            dist/arduracer.cue
            dist/arduracer.iso
            dist/arduracer.exe
            dist/SHA256SUMS
