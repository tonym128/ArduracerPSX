name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FMV encoder used by tools/fmv_cook/cook_intro_str.py. Pinned with checksums;
  # without it the intro FMV degrades to a silent procedural placeholder.
  PSXAVENC_VERSION: "0.3.1"
  PSXAVENC_SHA256: ad22b887683631149fb8c7c85ecea8bb760dd482f9e18cce2b35b11319e95e51
  PSXAVENC_BIN_SHA256: 135fa941d750f6be0dd4176ffbab9fd70d801d68f931f1a609c4e701ef95972a
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host tests, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the vendored PSoXide SDK is present
        # psoxide/sdk is committed here (see psoxide/PROVENANCE.md). Assert it up
        # front so a partial checkout fails with one line rather than a cargo
        # manifest error deep in the log.
        run: make deps

      - name: Show toolchain
        run: rustup show

      - name: Check formatting
        run: |
          for m in crates/arduracer-core tools/test_game_logic tools/playtest tools/test_memcard tools/test_ui game; do
            if [ -f "$m/Cargo.toml" ]; then
              echo "::group::$m"
              cargo fmt --manifest-path "$m/Cargo.toml" --all -- --check
              echo "::endgroup::"
            fi
          done

      - name: Clippy
        run: |
          cargo clippy --manifest-path crates/arduracer-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/test_game_logic/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/playtest/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/test_memcard/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path tools/test_ui/Cargo.toml --all-targets -- -D warnings

      - name: Run host-side game logic tests
        run: |
          cargo test --manifest-path crates/arduracer-core/Cargo.toml
          cargo run --manifest-path tools/test_game_logic/Cargo.toml
          cargo test --manifest-path tools/test_memcard/Cargo.toml
          cargo test --manifest-path tools/test_ui/Cargo.toml

      - name: Verify all 24 circuits are drivable
        run: cargo run --manifest-path tools/playtest/Cargo.toml --release

  game:
    name: PSX cross-build & RAM budget gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MIPS bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu

      - name: Check the vendored PSoXide SDK is present
        # psoxide/sdk is committed here (see psoxide/PROVENANCE.md). Assert it up
        # front so a partial checkout fails with one line rather than a cargo
        # manifest error deep in the log.
        run: make deps

      - name: Show toolchain
        run: rustup show

      - name: Build PSX Executable
        run: make ci-game

  disc:
    name: Disc mastering smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MIPS bare-metal toolchain & media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mipsel-linux-gnu ffmpeg

      - name: Install psxavenc (FMV encoder)
        # tools/fmv_cook/cook_intro_str.py silently falls back to a procedural
        # placeholder FMV -- no audio -- when psxavenc is absent. That is what CI
        # shipped: the deployed exe was 253,952 bytes against 346,112 for a local
        # build, which is exactly the 91 KB intro ADPCM. Pinned release, checksum
        # verified on both the archive and the extracted binary.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/psxavenc.zip \
            https://github.com/WonderfulToolchain/psxavenc/releases/download/v${PSXAVENC_VERSION}/psxavenc-linux.zip
          echo "${PSXAVENC_SHA256}  /tmp/psxavenc.zip" | sha256sum -c -
          unzip -o -q /tmp/psxavenc.zip -d /tmp/psxavenc
          echo "${PSXAVENC_BIN_SHA256}  /tmp/psxavenc/bin/psxavenc" | sha256sum -c -
          sudo install -m 0755 /tmp/psxavenc/bin/psxavenc /usr/local/bin/psxavenc
          psxavenc 2>&1 | head -1 || true

      - name: Check the vendored PSoXide SDK is present
        run: make deps

      - name: Master PS1 Disc Image
        run: make ci-disc
