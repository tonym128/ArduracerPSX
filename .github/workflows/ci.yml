name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # FMV encoder used by tools/fmv_cook/cook_intro_str.py. Pinned with checksums;
  # without it the intro FMV degrades to a silent procedural placeholder.
  PSXAVENC_VERSION: "0.3.1"
  PSXAVENC_SHA256: ad22b887683631149fb8c7c85ecea8bb760dd482f9e18cce2b35b11319e95e51
  PSXAVENC_BIN_SHA256: 135fa941d750f6be0dd4176ffbab9fd70d801d68f931f1a609c4e701ef95972a
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host tests, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check the vendored PSoXide SDK is present
        # psoxide/sdk is committed here (see psoxide/PROVENANCE.md). Assert it up
        # front so a partial checkout fails with one line rather than a cargo
        # manifest error deep in the log.
        run: make deps

      - name: Show toolchain
        run: rustup show

      - name: Check formatting
        # `make fmt-check` owns the crate list; duplicating it here is how the
        # two drift apart and a crate silently stops being checked.
        run: make fmt-check

      - name: Clippy (host crates)
        run: make clippy-host

      - name: Clippy (bare-metal game crate)
        # `game` cannot be linted with --all-targets: game/.cargo/config.toml sets
        # `build-std = ["core"]`, so there is no `test` crate for the
        # mipsel-sony-psx target and cargo dies with E0463 before clippy runs.
        # The bin target is the only thing it can check, and it used to be
        # checked by nothing at all -- game/src was fmt-only.
        run: make clippy-game

      - name: Run host-side game logic tests
        run: make test

      - name: Verify all 24 circuits are drivable
        # Par-time drift against tools/track_cook/par_calibration.json fails here
        # too: the harness treats a stale generated table the same as an
        # undrivable circuit. Escape hatches exist for local work
        # (PLAYTEST_FLAGS=--allow-par-drift) but CI runs the strict default.
        run: make playtest

  game:
    name: PSX cross-build & RAM budget gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Check the vendored PSoXide SDK is present
        # psoxide/sdk is committed here (see psoxide/PROVENANCE.md). Assert it up
        # front so a partial checkout fails with one line rather than a cargo
        # manifest error deep in the log.
        run: make deps

      - name: Show toolchain
        run: rustup show

      # No binutils needed: `make ci-game` reads the footprint out of the rust-lld
      # link map that `make exe` emits, so the gate works on a stock
      # ubuntu-latest runner. (binutils-mipsel-linux-gnu was installed here for a
      # `stat -c%s` check that could not see .bss and could never fire.)
      - name: Build PSX Executable & enforce the static RAM budget
        run: make ci-game

  disc:
    name: Disc mastering smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install media and cooking tools
        # ffmpeg for wav2vag.py; python3-numpy and python3-pil for track atlas / city asset cookers.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-numpy python3-pil python3-cairosvg zip

      - name: Install psxavenc (FMV encoder)
        # tools/fmv_cook/cook_intro_str.py silently falls back to a procedural
        # placeholder FMV -- no audio -- when psxavenc is absent. That is what CI
        # shipped: the deployed exe was 253,952 bytes against 346,112 for a local
        # build, which is exactly the 91 KB intro ADPCM. Pinned release, checksum
        # verified on both the archive and the extracted binary.
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/psxavenc.zip \
            https://github.com/WonderfulToolchain/psxavenc/releases/download/v${PSXAVENC_VERSION}/psxavenc-linux.zip
          echo "${PSXAVENC_SHA256}  /tmp/psxavenc.zip" | sha256sum -c -
          unzip -o -q /tmp/psxavenc.zip -d /tmp/psxavenc
          echo "${PSXAVENC_BIN_SHA256}  /tmp/psxavenc/bin/psxavenc" | sha256sum -c -
          sudo install -m 0755 /tmp/psxavenc/bin/psxavenc /usr/local/bin/psxavenc
          psxavenc 2>&1 | head -1 || true

      - name: Check the vendored PSoXide SDK is present
        run: make deps

      - name: Master PS1 Disc Image
        run: make ci-disc

      - name: Master PS1 ISO and Package Release
        run: |
          make iso
          make release VERSION=latest

      - name: Upload Disc Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arduracer-psx-disc
          path: |
            dist/arduracer.bin
            dist/arduracer.cue
            dist/arduracer.iso
            dist/arduracer.exe
            dist/ArduracerPSX-vlatest-PSX.zip
            dist/SHA256SUMS

  publish-release:
    name: Publish Rolling Release
    needs: [host, game, disc]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Disc Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: arduracer-psx-disc
          path: dist

      - name: Force update rolling Git tag
        env:
          TAG_NAME: latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "${{ github.sha }}"
          git push -f origin "$TAG_NAME"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Arduracer PSX (Latest Build)"
          body: |
            Automated rolling release from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).

            ### PS1 Disc Images & Binaries
            - **`arduracer.cue`**: PlayStation 1 CUE sheet (Track 01 Data + Tracks 02-07 CD-DA audio).
            - **`arduracer.bin`**: Raw 2352-byte/sector disc image with FMV, XA, and CD-DA audio.
            - **`arduracer.iso`**: Cooked ISO9660 image (Data track).
            - **`arduracer.exe`**: Bare-metal MIPS PS-X executable.
            - **`ArduracerPSX-vlatest-PSX.zip`**: Complete release package including game manual (`GAME.md`), artwork, and binaries.
            - **`SHA256SUMS`**: SHA256 checksums for verification.

            *This release updates automatically on every successful build on `main`.*
          prerelease: false
          make_latest: true
          files: |
            dist/arduracer.cue
            dist/arduracer.bin
            dist/arduracer.iso
            dist/arduracer.exe
            dist/ArduracerPSX-vlatest-PSX.zip
            dist/SHA256SUMS
