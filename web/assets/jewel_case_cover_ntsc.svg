<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0814"/>
      <stop offset="45%" stop-color="#180e28"/>
      <stop offset="80%" stop-color="#2a1236"/>
      <stop offset="100%" stop-color="#3d1430"/>
    </linearGradient>
    <linearGradient id="ps-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="35%" stop-color="#ff5500"/>
      <stop offset="70%" stop-color="#ffbb00"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="grid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bg-grad)"/>

  <!-- Retro Synthwave Perspective Grid -->
  <g stroke="#00ffff" stroke-width="1.5" opacity="0.35">
    <line x1="450" y1="360" x2="100" y2="800"/>
    <line x1="450" y1="360" x2="200" y2="800"/>
    <line x1="450" y1="360" x2="320" y2="800"/>
    <line x1="450" y1="360" x2="450" y2="800"/>
    <line x1="450" y1="360" x2="580" y2="800"/>
    <line x1="450" y1="360" x2="700" y2="800"/>
    <line x1="450" y1="360" x2="800" y2="800"/>

    <line x1="100" y1="450" x2="800" y2="450"/>
    <line x1="90" y1="510" x2="800" y2="510"/>
    <line x1="85" y1="580" x2="800" y2="580"/>
    <line x1="85" y1="660" x2="800" y2="660"/>
    <line x1="85" y1="750" x2="800" y2="750"/>
  </g>

  <!-- Neon Sun / Horizon Glow -->
  <circle cx="450" cy="360" r="140" fill="#ff0055" opacity="0.25" filter="url(#glow)"/>
  <circle cx="450" cy="360" r="100" fill="#ffbb00" opacity="0.2" filter="url(#glow)"/>

  <!-- Left Black PlayStation Stripe (US Format) -->
  <rect x="0" y="0" width="85" height="800" fill="url(#ps-band)"/>
  <rect x="83" y="0" width="2" height="800" fill="#333333"/>

  <!-- Vertical "PlayStation" text on black stripe -->
  <g transform="translate(52, 420) rotate(-90)">
    <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">PlayStation</text>
  </g>

  <!-- Classic PlayStation Logo at top of stripe -->
  <g transform="translate(22, 35) scale(0.65)">
    <path d="M25 10 L25 75 L45 75 L45 48 L58 48 C72 48 80 40 80 29 C80 18 72 10 58 10 Z M45 25 L56 25 C62 25 65 27 65 29 C65 32 62 34 56 34 L45 34 Z" fill="#df0024"/>
    <path d="M15 65 C25 62 38 62 48 65 C60 68 70 75 65 82 C60 88 42 88 30 84 C20 80 12 75 15 65 Z" fill="#f3c300" opacity="0.9"/>
    <path d="M45 68 C58 66 75 66 82 72 C88 77 82 85 68 87 C52 89 35 88 45 68 Z" fill="#00ac9f" opacity="0.9"/>
  </g>

  <!-- Stylized Low-Poly Sports Car Silhouette in High-Speed Drift -->
  <g transform="translate(440, 520) scale(1.3)">
    <!-- Motion trails & neon sparks -->
    <path d="M -160 50 L -80 30 L 40 40" stroke="#00ffff" stroke-width="4" fill="none" opacity="0.8"/>
    <path d="M -140 60 L -60 45 L 60 55" stroke="#ff007f" stroke-width="5" fill="none" opacity="0.9"/>
    <path d="M -180 70 L -40 55 L 80 65" stroke="#ffbb00" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- Car body profile (sleek wedge silhouette) -->
    <polygon points="-70,25 -30,0 35,-2 75,18 90,32 -60,35" fill="#181e28" stroke="#00ffff" stroke-width="2"/>
    <!-- Cabin canopy / glass -->
    <polygon points="-25,5 5,0 30,12 -15,16" fill="#00ffff" opacity="0.7"/>
    <!-- Headlight beam -->
    <polygon points="85,28 160,10 170,45 88,34" fill="#00ffff" opacity="0.3"/>
    <!-- Wheels -->
    <circle cx="-45" cy="35" r="14" fill="#0a0d12" stroke="#ff007f" stroke-width="3"/>
    <circle cx="60" cy="35" r="14" fill="#0a0d12" stroke="#ff007f" stroke-width="3"/>
    <!-- Wheel rims -->
    <circle cx="-45" cy="35" r="7" fill="#ffbb00"/>
    <circle cx="60" cy="35" r="7" fill="#ffbb00"/>
  </g>

  <!-- Title & Branding Banner -->
  <g transform="translate(450, 160)">
    <text x="0" y="-30" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" fill="#00ffff" text-anchor="middle" letter-spacing="6">ARCADE SPEED OVERDRIVE</text>
    <text x="0" y="45" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" fill="#ffffff" stroke="#000000" stroke-width="4" text-anchor="middle" letter-spacing="6">ARDURACER</text>
    <text x="4" y="42" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="64" fill="url(#title-grad)" text-anchor="middle" letter-spacing="6">ARDURACER</text>
    <text x="0" y="85" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffbb00" text-anchor="middle" letter-spacing="4">24 WORLD CIRCUITS // 6 CAR PACK // DUALSHOCK</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(450, 740)">
    <rect x="-180" y="-20" width="360" height="32" fill="#000000" opacity="0.7" rx="4" stroke="#ff007f" stroke-width="1.5"/>
    <text x="0" y="2" font-family="'Arial Black', sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="2">60 FPS TOP-DOWN DRIFT ACTION</text>
  </g>
</svg>
