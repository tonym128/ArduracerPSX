<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Silver Disc Metallic Gradient -->
    <radialGradient id="disc-silver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141a20"/>
      <stop offset="35%" stop-color="#221e28"/>
      <stop offset="70%" stop-color="#2d2238"/>
      <stop offset="90%" stop-color="#1b1722"/>
      <stop offset="100%" stop-color="#100d16"/>
    </radialGradient>
    <!-- Neon Speed Gradient -->
    <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <filter id="disc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Disc Boundary (120mm CD) -->
  <circle cx="400" cy="400" r="380" fill="url(#disc-silver)" stroke="#ff0055" stroke-width="4"/>

  <!-- Tachometer Speedometer Dial Grooves -->
  <g stroke="#00d2ff" stroke-width="1.5" fill="none" opacity="0.4">
    <circle cx="400" cy="400" r="350"/>
    <circle cx="400" cy="400" r="310"/>
    <circle cx="400" cy="400" r="270" stroke-dasharray="12 6"/>
    <circle cx="400" cy="400" r="230"/>
    <circle cx="400" cy="400" r="190"/>
  </g>

  <!-- Racing RPM Tick Marks -->
  <g stroke="#ffcc00" stroke-width="2" opacity="0.5">
    <line x1="400" y1="50" x2="400" y2="80"/>
    <line x1="647" y1="152" x2="626" y2="173"/>
    <line x1="750" y1="400" x2="720" y2="400"/>
    <line x1="647" y1="647" x2="626" y2="626"/>
    <line x1="400" y1="750" x2="400" y2="720"/>
    <line x1="152" y1="647" x2="173" y2="626"/>
    <line x1="50" y1="400" x2="80" y2="400"/>
    <line x1="152" y1="152" x2="173" y2="173"/>
  </g>

  <!-- Clear Stacking Ring / Mirror Band (46mm) -->
  <circle cx="400" cy="400" r="140" fill="#0d0a14" stroke="#4d2266" stroke-width="2"/>

  <!-- Center Spindle Hole (15mm) -->
  <circle cx="400" cy="400" r="50" fill="#000000" stroke="#ff0055" stroke-width="3"/>

  <!-- TOP HALF: Game Branding & Logo -->
  <g transform="translate(400, 180)">
    <!-- Subtitle Banner -->
    <rect x="-180" y="-45" width="360" height="22" fill="#ff0055" opacity="0.95" rx="3"/>
    <text x="0" y="-29" font-family="'Arial Black', Impact, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">HIGH-OCTANE ARCADE RACER</text>

    <!-- Main Title -->
    <text x="0" y="25" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#ffffff" stroke="#000" stroke-width="3" text-anchor="middle" letter-spacing="5">ARDURACER</text>
    <text x="3" y="23" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="url(#neon-orange)" text-anchor="middle" letter-spacing="5">ARDURACER</text>

    <text x="0" y="52" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="13" fill="#00d2ff" text-anchor="middle" letter-spacing="3">24 CIRCUITS // 6 RIVALS // CD-DA AUDIO</text>
  </g>

  <!-- LEFT: PlayStation Official Logo & Licensing -->
  <g transform="translate(140, 370)">
    <g transform="scale(0.8)">
      <path d="M25 10 L25 75 L45 75 L45 48 L58 48 C72 48 80 40 80 29 C80 18 72 10 58 10 Z M45 25 L56 25 C62 25 65 27 65 29 C65 32 62 34 56 34 L45 34 Z" fill="#df0024"/>
      <path d="M15 65 C25 62 38 62 48 65 C60 68 70 75 65 82 C60 88 42 88 30 84 C20 80 12 75 15 65 Z" fill="#f3c300" opacity="0.9"/>
      <path d="M45 68 C58 66 75 66 82 72 C88 77 82 85 68 87 C52 89 35 88 45 68 Z" fill="#00ac9f" opacity="0.9"/>
    </g>
    <text x="40" y="105" font-family="'Arial Black', Impact, sans-serif" font-size="14" fill="#ffffff" letter-spacing="2">PlayStation</text>
    <text x="40" y="125" font-family="monospace" font-size="10" fill="#a0aec0">SLUS-00999</text>
    <text x="40" y="140" font-family="monospace" font-size="9" fill="#718096">NTSC U/C &bull; REDBOOK AUDIO</text>
  </g>

  <!-- RIGHT: Compact Disc Logo & Features -->
  <g transform="translate(560, 370)">
    <rect x="-35" y="0" width="70" height="42" fill="#1b1526" stroke="#4a3b60" stroke-width="1.5" rx="3"/>
    <text x="0" y="18" font-family="'Arial Black', sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">COMPACT</text>
    <text x="0" y="32" font-family="'Arial Black', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">disc</text>
    <text x="0" y="58" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#ff5500" text-anchor="middle">60 FPS ARCADE</text>
    <text x="0" y="73" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="10" fill="#00d2ff" text-anchor="middle">DUALSHOCK READY</text>
    <text x="0" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="9" fill="#a0aec0" text-anchor="middle">MEMORY CARD 1 BLOCK</text>
  </g>

  <!-- BOTTOM: Legal & Sound Tracks -->
  <g transform="translate(400, 640)">
    <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#a0aec0" text-anchor="middle" letter-spacing="1">
      TRACK 1: DATA &bull; TRACK 2-7: CD-DA SOUNDTRACK (EUROBEAT &amp; SYNTHWAVE)
    </text>
    <text x="0" y="18" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#718096" text-anchor="middle">
      &copy; 2026 ARDURACER TEAM. BUILT WITH PSOXIDE FOR SONY PLAYSTATION CONSOLE. ALL RIGHTS RESERVED.
    </text>
  </g>
</svg>
